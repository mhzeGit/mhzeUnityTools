<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Task Board</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2315171b'/%3E%3Crect x='7' y='8' width='5' height='16' rx='2' fill='%236ea8fe'/%3E%3Crect x='14' y='8' width='5' height='11' rx='2' fill='%23f2b65a'/%3E%3Crect x='21' y='8' width='5' height='7' rx='2' fill='%2352c48d'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="brand-name" id="board-name">Task Board</span>
    </div>
    <label class="search">
      <span class="icon" data-icon="search"></span>
      <input id="search" type="search" placeholder="Search tasks" autocomplete="off" spellcheck="false">
      <kbd>/</kbd>
    </label>
    <div class="filters">
      <select id="project-filter" aria-label="Project"></select>
      <button class="chip-toggle" id="toggle-cancelled" aria-pressed="false" title="Show the Cancelled column">Cancelled</button>
    </div>
    <div class="spacer"></div>
    <div class="summary" id="summary"></div>
    <div class="live" id="live" title="Live updates"><span class="dot"></span><span class="live-label">Connecting</span></div>
    <button class="icon-button" id="toggle-feed" title="Activity (A)"><span class="icon" data-icon="activity"></span></button>
    <button class="primary" id="new-task" title="New task (N)"><span class="icon" data-icon="plus"></span>New task</button>
  </header>

  <main class="board" id="board" aria-live="polite"></main>

  <aside class="panel drawer" id="drawer" aria-hidden="true"></aside>
  <aside class="panel feed" id="feed" aria-hidden="true">
    <div class="panel-head">
      <h2>Activity</h2>
      <button class="icon-button" data-close="feed" title="Close (Esc)"><span class="icon" data-icon="x"></span></button>
    </div>
    <ol class="feed-list" id="feed-list"></ol>
  </aside>

  <dialog class="editor" id="editor"></dialog>
  <dialog class="ask" id="ask"></dialog>
  <div class="toasts" id="toasts" role="status"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
